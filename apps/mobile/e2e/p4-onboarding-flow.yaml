# P4 UC-01 walk (docs/verification/p4-manual-verification.md): fresh install → welcome →
# rMEQ survey (all five answered to the maximum-morningness pattern = score 25 → DM) →
# hours (defaults) → categories → one seed task via quick-add → finish → tab shell; then a
# relaunch must land straight in the shell (gate reads the persisted profile). After this
# flow the runner inspects the app container's SQLite: the anonymous adopt must have
# rewritten user_id off the local: placeholder, and the profile_update op must be acked
# (bridge push accepted by the hosted project).
#
# clearState resets SQLite + MMKV + keychain — a true first launch, so the anonymous
# bootstrap fires during the walk.
appId: com.hourwell.app
---
- launchApp:
    stopApp: true
    clearState: true
- assertVisible: 'The planner that learns your best hours'
- tapOn: 'Get started'
- assertVisible: 'Your rhythm'
# (the blank-answers note + its disappearance are pinned by jest — onboarding.test.tsx)
- tapOn: '5:00–6:30'
- scrollUntilVisible:
    element: 'Very refreshed'
- tapOn: 'Very refreshed'
- scrollUntilVisible:
    element: '20:00–21:00'
- tapOn: '20:00–21:00'
- scrollUntilVisible:
    element: '5:00–8:00'
- tapOn: '5:00–8:00'
- scrollUntilVisible:
    element: 'Definitely a morning type'
- tapOn: 'Definitely a morning type'
- scrollUntilVisible:
    element: 'Continue'
- tapOn: 'Continue'
- assertVisible: 'Your hours'
- assertVisible: 'Monday.*'
- scrollUntilVisible:
    element: 'Continue'
- tapOn: 'Continue'
- assertVisible: 'What fills your days?'
- tapOn: 'Deep work'
- tapOn: 'Continue'
- assertVisible: 'Add your first tasks'
- tapOn: 'Quick add task'
- inputText: 'thesis intro 90m'
- tapOn: 'Add'
- assertVisible: '1 added'
# device: the soft keyboard stays up after Add and covers the button (no-op on simulator)
- hideKeyboard
- tapOn: 'Finish setup'
# landed in the shell
- assertVisible: 'No plan yet'
- tapOn: 'Inbox(, tab.*)?'
# quick-add default category is Admin (P3: categories are form-edited, never NL-guessed)
- assertVisible: 'thesis intro, Admin, 90 minutes'
# anonymous trial session reached Settings (FR-01)
- tapOn: 'Open settings'
- assertVisible: 'Account'
- assertVisible: 'Trial account on this device'
# relaunch: the gate must skip onboarding now
- launchApp:
    stopApp: true
- assertVisible: 'No plan yet'
