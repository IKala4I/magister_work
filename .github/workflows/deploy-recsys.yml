# SUSPENDED (2026-08-27): Hugging Face withdrew free Docker Spaces in July 2026 (spec-conflicts H4).
# The workflow is inert while `vars.HF_SPACE` is unset and stays so until the owner decides the
# replacement host in docs/decisions/ADR-0009-recsys-hosting.md; it is rewritten for that host then.
name: Deploy RecSys to Hugging Face Space (suspended — ADR-0009)

on:
  push:
    branches: [main]
    paths: ['services/recsys/**', '.github/workflows/deploy-recsys.yml']
  workflow_dispatch:

jobs:
  deploy:
    name: Push services/recsys subtree to the Space
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split the service subtree
        run: git subtree split --prefix services/recsys -b hf-deploy
      - name: Push to the Space (force — the Space mirrors main's subtree)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
