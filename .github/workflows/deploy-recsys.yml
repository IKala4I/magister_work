# Build the RecSys image for the ADR-0009 VM (linux/arm64), verify OR-Tools CP-SAT solves inside
# it on a native arm64 runner, publish to GHCR, then confirm the VM rolled it out (pull-based
# rollout: the VM's systemd timer pulls `:latest` every 5 min — no SSH from CI, port 22 stays
# restricted to the owner's IP). Runbook: docs/runbooks/oracle-vm.md.
name: RecSys image → GHCR → VM rollout

on:
  push:
    branches: [main]
    paths: ['services/recsys/**', '.github/workflows/deploy-recsys.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-recsys
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/arm64, verify CP-SAT, push
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires a lowercase owner)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hourwell-recsys" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (arm64, loaded locally for verification)
        uses: docker/build-push-action@v6
        with:
          context: services/recsys
          platforms: linux/arm64
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: RECSYS_BUILD=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the OR-Tools aarch64 wheel — a real CP-SAT solve with 2 workers inside the image
        run: |
          docker run --rm "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" /opt/venv/bin/python - <<'PY'
          import platform, ortools
          from ortools.sat.python import cp_model
          m = cp_model.CpModel()
          x = m.new_int_var(0, 10, "x"); y = m.new_int_var(0, 10, "y")
          m.add(x + y >= 7); m.add(x <= 3); m.minimize(2 * x + y)
          s = cp_model.CpSolver(); s.parameters.max_time_in_seconds = 1.5; s.parameters.num_workers = 2
          status = s.solve(m)
          assert platform.machine() == "aarch64", platform.machine()
          assert s.status_name(status) == "OPTIMAL" and s.value(x) == 0 and s.value(y) == 7
          print("ok", platform.machine(), "ortools", ortools.__version__)
          PY
      - name: Verify the service boots (in-memory state) and /healthz reports build + arch
        run: |
          cid=$(docker run -d --rm -p 7860:7860 "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}")
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7860/healthz > /tmp/healthz.json 2>/dev/null; then break; fi; sleep 1
          done
          cat /tmp/healthz.json; echo
          jq -e --arg sha "${{ steps.meta.outputs.sha }}" '.status=="ok" and .build==$sha and .arch=="aarch64" and .storage=="memory"' /tmp/healthz.json
          docker stop "$cid" >/dev/null
      - name: Push (sha + latest)
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

  rollout:
    name: Confirm the VM picked up the build
    needs: build
    if: ${{ vars.RECSYS_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Poll https://${{ vars.RECSYS_HOST }}/healthz until .build == ${{ needs.build.outputs.sha }} (≤ 12 min)
        run: |
          for i in $(seq 1 48); do
            body=$(curl -fsS --max-time 10 "https://${{ vars.RECSYS_HOST }}/healthz" || true)
            build=$(jq -r '.build // empty' <<<"$body" 2>/dev/null || true)
            if [ "$build" = "${{ needs.build.outputs.sha }}" ]; then
              echo "rolled out: $body"
              jq -e '.storage=="postgres" and .arch=="aarch64"' <<<"$body"
              exit 0
            fi
            echo "attempt $i: build=${build:-none}"; sleep 15
          done
          echo "::error::the VM did not serve build ${{ needs.build.outputs.sha }} within 12 min — check journalctl -u hourwell-rollout on the box"
          exit 1
