name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ts:
    name: TypeScript gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: expo-doctor
        run: npx expo-doctor
        working-directory: apps/mobile

  db:
    name: Database gates (pgTAP + contract sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start local database with migrations
        run: supabase db start && supabase db reset
      - name: pgTAP suite (RLS bypass, append-only, M-01/M-02, prior seed values, P6 plan rows)
        run: supabase test db
      - name: Contract sync — regenerated types match committed (File 03 §6 step 1)
        run: |
          supabase gen types typescript --local > /tmp/database.gen.ts
          ./scripts/normalize-db-types.sh /tmp/database.gen.ts
          ./scripts/normalize-db-types.sh packages/shared/src/database.ts
          git diff --exit-code packages/shared/src/database.ts
          diff -u packages/shared/src/database.ts /tmp/database.gen.ts
      - uses: astral-sh/setup-uv@v5
      - name: RecSys PostgresRepo against the local database (P5)
        working-directory: services/recsys
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          uv sync --locked
          uv run pytest -q tests/test_repo_postgres.py

  python:
    name: Python gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [services/recsys, training]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  edge:
    name: Edge Functions (Deno fmt/lint/check/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check _shared/*.ts plan-request/*.ts attribute-rewards/*.ts
      - name: Unit tests (arm-A heuristic, matched ε-draw, grid/φ parity with the service, plan-request + attribute-rewards handlers, reward mapping)
        run: deno test --allow-read --allow-env --allow-net

  api-contract:
    name: API contract sync (openapi → api.ts, File 03 §6 step 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/recsys
      - name: Regenerate api.ts and diff against the committed file
        run: |
          ./packages/shared/scripts/gen-api-types.sh
          git diff --exit-code packages/shared/src/api.ts
