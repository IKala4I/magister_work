name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ts:
    name: TypeScript gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: expo-doctor
        run: npx expo-doctor
        working-directory: apps/mobile

  db:
    name: Database gates (pgTAP + contract sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start local database with migrations
        run: supabase db start && supabase db reset
      - name: pgTAP suite (RLS bypass, append-only, M-01/M-02, prior seed values)
        run: supabase test db
      - name: Contract sync — regenerated types match committed (File 03 §6 step 1)
        run: |
          supabase gen types typescript --local > /tmp/database.gen.ts
          diff -u <(grep -v 'PostgrestVersion' packages/shared/src/database.ts) \
                  <(grep -v 'PostgrestVersion' /tmp/database.gen.ts)

  python:
    name: Python gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [services/recsys, training]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
