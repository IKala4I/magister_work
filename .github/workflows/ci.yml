name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ts:
    name: TypeScript gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: expo-doctor
        run: npx expo-doctor
        working-directory: apps/mobile

  thesis-numbers:
    name: Thesis numbers (recomputed from the study results)
    runs-on: ubuntu-latest
    # Owner rule 2026-09-09: a number that cannot be reproduced from docs/study/results/*.json
    # does not go into the thesis. The study documents' prose summaries are not the source —
    # three errors were found in them, twice inside a sentence that was itself a correction.
    # Stdlib only, no setup step needed: ubuntu-latest ships python3.
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/thesis/verify-numbers.py
      - name: Додаток К (the grid of worlds) matches the run it is generated from
        run: python3 docs/thesis/gen-dodatok-k.py --check
      - name: The assembled thesis passes the needle list
        run: python3 docs/thesis/verify-docx.py docs/thesis/text/full.md
      - name: The formatter brief still quotes the text verbatim
        run: python3 docs/thesis/verify-brief.py
      - name: The assembled thesis obeys the style decisions (bold, dash, listings, artefacts)
        run: python3 docs/thesis/verify-style.py
      # The department's 2026 guideline, where the rule is about the text: appendix letters and
      # order, captions and numbering, a reference to every table, figure and appendix, a citation
      # of every source. The self-test breaks the text once per rule and requires the rule to notice.
      - name: The assembled thesis obeys the department guideline (text rules)
        run: python3 docs/thesis/verify-guideline.py && python3 docs/thesis/verify-guideline.py --self-test
      # Documentation about state drifts the way the text does, only more quietly: ASSEMBLY.md's
      # own paragraph about the inline-correction gap was false within a day of being written,
      # and a study summary carried a wrong grid claim forward into a chapter draft. A state
      # claim that can be checked is checked. Reads only committed files, so it runs here.
      - name: The docs' claims about the pipeline match the pipeline
        run: python3 docs/thesis/verify-state.py
      # Since 2026-10-26 docs/thesis/text/full.md is the thesis's only source (the draft-based
      # assembler and its payload checker left the tree with the cut to four chapters), so every
      # checker above reads the text itself.

  # Which gates a pull request needs. Only the database gates are narrowed: they pull the Supabase
  # stack's images and check nothing a thesis or app-only change can break. A push to main (and a manual
  # run) always runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # what the db job reads: migrations, pgTAP tests, config; the committed types and their
          # normaliser; the recsys PostgresRepo and its test; this workflow
          DB_PATHS: '^(supabase/|packages/shared/|scripts/normalize-db-types\.sh$|services/recsys/|\.github/workflows/ci\.yml$)'
        run: |
          if [ "$EVENT" != pull_request ]; then echo db=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "::warning::cannot diff $BASE...$HEAD — running the database gates"
            echo db=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qE "$DB_PATHS"; then db=true; else db=false; fi
          echo "db=$db" | tee -a "$GITHUB_OUTPUT"

  db:
    name: Database gates (pgTAP + contract sync)
    needs: changes
    # Skipped only on an explicit db=false: a skipped job reports Success to branch protection, so
    # a failed or missing `changes` result must run the gates rather than wave them through.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.db != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # The CLI's default registry is public.ecr.aws, whose anonymous pulls share a data limit per
      # runner IP («Data limit exceeded»: repeated red runs since Oct 2026, none caused by code). Supabase publishes the same
      # images on ghcr.io; pulls there are authenticated with the job token.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::ghcr.io login failed — pulling the public images anonymously"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start local database with migrations
        run: supabase db start && supabase db reset
      - name: pgTAP suite (RLS bypass, append-only, M-01/M-02, prior seed values, P6 plan rows)
        run: supabase test db
      - name: Contract sync — regenerated types match committed (File 03 §6 step 1)
        run: |
          supabase gen types typescript --local > /tmp/database.gen.ts
          ./scripts/normalize-db-types.sh /tmp/database.gen.ts
          ./scripts/normalize-db-types.sh packages/shared/src/database.ts
          git diff --exit-code packages/shared/src/database.ts
          diff -u packages/shared/src/database.ts /tmp/database.gen.ts
      - uses: astral-sh/setup-uv@v5
      - name: RecSys PostgresRepo against the local database (P5)
        working-directory: services/recsys
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          uv sync --locked
          uv run pytest -q tests/test_repo_postgres.py

  python:
    name: Python gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [services/recsys, training]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  edge:
    name: Edge Functions (Deno fmt/lint/check/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check _shared/*.ts plan-request/*.ts attribute-rewards/*.ts sync-resolve/*.ts gcal-connect/*.ts gcal-callback/*.ts gcal-webhook/*.ts insights/*.ts export-data/*.ts delete-account/*.ts
      - name: Unit tests (arm-A heuristic, matched ε-draw, grid/φ parity with the service, plan-request + attribute-rewards handlers, reward mapping)
        run: deno test --allow-read --allow-env --allow-net

  api-contract:
    name: API contract sync (openapi → api.ts, File 03 §6 step 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/recsys
      - name: Regenerate api.ts and diff against the committed file
        run: |
          ./packages/shared/scripts/gen-api-types.sh
          git diff --exit-code packages/shared/src/api.ts
