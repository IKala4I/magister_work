[project]
name = "hourwell-recsys"
version = "0.1.0"
description = "Hourwell RecSys service: bandit-weighted CP-SAT planning (specs/03, specs/04)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "ortools>=9.15.6755",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "mabwiser>=2.7.4",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "scipy-stubs>=1.18.1.0",
    "river>=0.26.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["mabwiser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
